name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/fetch-submodules.sh vendor/iotop
      - name: Check that the release tag matches vendor/iotop
        run: |
          iotop_version="v$(sed -n 's/^#define VERSION "\(.*\)"$/\1/p' vendor/iotop/src/iotop.h)"
          if [ "$iotop_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match vendor/iotop ($iotop_version)"
            exit 1
          fi
  build:
    needs: check-version
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-amd64
          - os: ubuntu-24.04-arm
            asset: linux-arm64
          - os: ubuntu-latest
            asset: linux-musl-amd64
            static: true
          - os: ubuntu-24.04-arm
            asset: linux-musl-arm64
            static: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/fetch-submodules.sh
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2
      - run: ./build.sh ${{ matrix.static && '--static' || '' }}
      - name: Package iotop
        run: |
          dist="dist${{ matrix.static && '-static' || '' }}"
          # the license texts travel with the binaries
          lic="$dist/share/licenses/iotop-static"
          mkdir -p "$lic"
          cp LICENSE NOTICE "$lic/"
          for dir in vendor/*/; do
            for file in "$dir"LICENSE* "$dir"LICENCE* "$dir"COPYING*; do
              [ -f "$file" ] && cp "$file" "$lic/$(basename "$dir")-$(basename "$file")" || true
            done
          done
          tar -czf iotop-static-${{ matrix.asset }}.tar.gz -C "$dist" bin share
      - name: Collect sources
        if: matrix.asset == 'linux-amd64'
        run: tar -czf iotop-static-sources.tar.gz --exclude=.git vendor
      - uses: actions/upload-artifact@v7
        with:
          name: iotop-static-${{ matrix.asset }}
          path: iotop-static-*.tar.gz
          retention-days: 1
  release:
    name: Upload to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: iotop-static-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
